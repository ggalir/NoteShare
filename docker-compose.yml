services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notes:
    image: postgres:16
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - postgres-notes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notes"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-sharing:
    image: postgres:16
    environment:
      POSTGRES_DB: sharing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5435:5432"
    volumes:
      - postgres-sharing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sharing"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services ───────────────────────────────────────────────────

  noteshare-auth:
    build:
      context: ./noteshare-auth
      dockerfile: ../Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/auth
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  noteshare-notes:
    build:
      context: ./noteshare-notes
      dockerfile: ../Dockerfile
    ports:
      - "8082:8082"
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-notes:5432/notes
      DB_USERNAME: ${NOTES_DB_USERNAME}
      DB_PASSWORD: ${NOTES_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      postgres-notes:
        condition: service_healthy

  noteshare-sharing:
    build:
      context: ./noteshare-sharing
      dockerfile: ../Dockerfile
    ports:
      - "8083:8083"
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-sharing:5432/sharing
      DB_USERNAME: ${SHARING_DB_USERNAME}
      DB_PASSWORD: ${SHARING_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      NOTES_SERVICE_URL: http://noteshare-notes:8082
    depends_on:
      postgres-sharing:
        condition: service_healthy
      noteshare-notes:
        condition: service_started

  noteshare-mailer:
    build:
      context: ./noteshare-mailer
      dockerfile: ../Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD}
      AUTH_VERIFY_URL: http://localhost:3000/verify
    depends_on:
      rabbitmq:
        condition: service_healthy

  noteshare-frontend:
    build:
      context: ./noteshare-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - noteshare-auth
      - noteshare-notes
      - noteshare-sharing

volumes:
  postgres-auth-data:
  postgres-notes-data:
  postgres-sharing-data: